name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    env:
      BUILD_TYPE: Release
      BUILD_PLATFORM: custom
      CMAKE_PRESET: windows_msvc
      PRISMLAUNCHER_VERSION: custom-build

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: Release
          artifact-name: Windows-MSVC
          vcvars-arch: amd64
          qt-version: 6.10.2

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset windows_msvc `
            -DLauncher_UPDATER_GITHUB_REPO="" `
            -DLauncher_BUILD_ARTIFACT=""

      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset windows_msvc --config Release

      - name: Install
        shell: pwsh
        run: |
          cmake --install build --config Release

      - name: Upload launcher
        uses: actions/upload-artifact@v7
        with:
          name: PrismLauncher-Windows-Manual-Update
          path: install/**
